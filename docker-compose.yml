services:
  postgres:
    image: postgres:17

    container_name: civicos-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: civicos
      POSTGRES_USER: civicos
      POSTGRES_PASSWORD: civicos

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
