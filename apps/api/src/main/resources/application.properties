spring.application.name=civicos-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/civicos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civicos}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}